name: Bug report
description: Something in a plugin is broken or behaving wrong
labels: ["bug"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin?
      options:
        - Staff Tags
        - RoleColorEverywhere
        - PronounDB
        - Message Snippets
        - Reminders
        - Not sure / something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you actually get?
      placeholder: "I tried /snippet welcome and nothing was sent to the channel."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the plugin
        2. Run /snippet welcome
        3. ...
    validations:
      required: false

  - type: input
    id: discord-version
    attributes:
      label: Discord app version (Settings → About)
      placeholder: "e.g. 338.4"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Anything in the Revenge debugger/logs?
      description: Settings → General → Debugger, if you have it enabled
    validations:
      required: false
